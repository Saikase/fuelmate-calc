name: Auto Update Fuel Prices

on:
  schedule:
    # 08:05 UTC = 15:05 GMT+7 (Every Thursday - Vietnam Petrolimex adjustment cycle)
    - cron: '5 8 * * 4'
    # 00:00 UTC Every Monday (Global fuel prices cycle)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and update fuel prices
        run: node scripts/fetch_fuel_prices.mjs

      - name: Check for changes and commit
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fuel_prices.json
          if git diff --staged --quiet; then
            echo "No price changes detected."
          else
            git commit -m "chore(data): auto-update fuel prices [skip ci]"
            git push
          fi
